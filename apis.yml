name: Goodlegal
description: Goodlegal was a Bucharest-based legal-tech startup founded in 2021 by Vasile
  Tiple (former UiPath Head of Legal Automation) building a legal infrastructure platform
  and "one-stop shop for legal compliance" — a drag-and-drop document builder, out-of-the-box
  document templates, an editor with text analysis, e-signature, workflow automation, and
  integrations aimed at standardizing legal work for individuals and organizations. It raised
  a ~EUR 1.2M pre-seed round in 2022 led by Earlybird's Digital East Fund. The company wound
  down and shut off its platform at the end of 2023 (per founder Vasile Tiple's "Final thoughts
  on Goodlegal" post), and the goodlegal.io domain is now parked / listed for sale. No public
  API, developer portal, documentation, or machine-readable API surface was ever published, and
  none exists today. This profile is retained as a historical/defunct portfolio-lead record.
